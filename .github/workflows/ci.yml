name: CI

# Mirrors the local commit gate in the same order:
#   format check -> lint -> type-check -> test -> build
# Any divergence between this file and what you run before committing is a gap.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# A new push to the same branch supersedes an in-flight run.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Format, lint, types, test, build
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1

      # Node 24 is a known-good version. The engine-floor job separately proves
      # the declared minimum still builds, so the primary job does not have to.
      - name: Set up pnpm
        uses: pnpm/action-setup@v6.1.0
        with:
          version: 11.16.0

      - name: Set up Node
        uses: actions/setup-node@v7.0.0
        with:
          node-version: '24'
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Format check
        run: pnpm format:check

      - name: Lint
        run: pnpm lint

      - name: Type-check
        run: pnpm typecheck

      # Collects only src/ — see vitest.config.ts exclude. Asserting the
      # count here because ERR-003 shipped a suite of 1,498 tests (145 of them
      # from a nested node_modules) that all "passed" locally.
      - name: Test
        run: pnpm test

      - name: Verify test collection scope
        run: |
          count=$(pnpm vitest list --filesOnly | grep -c '^src/')
          echo "Test files collected from src/: $count"
          if [ "$count" -eq 0 ]; then
            echo "::error::No tests collected from src/ — check vitest exclude patterns"
            exit 1
          fi

      - name: Build
        run: pnpm build

      - name: Upload test results artifact
        if: always()
        uses: actions/upload-artifact@v7.0.1
        with:
          name: test-results
          path: coverage/
          retention-days: 7
          if-no-files-found: ignore

  engine-floor:
    name: Node engine floor (${{ matrix.node }})
    runs-on: ubuntu-latest
    timeout-minutes: 10

    strategy:
      fail-fast: false
      matrix:
        node: ['22.13.0', '24']

    steps:
      - uses: actions/checkout@v7.0.1

      - uses: pnpm/action-setup@v6.1.0
        with:
          version: 11.16.0

      - uses: actions/setup-node@v7.0.0
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # Proves package.json `engines` is not a lie. The floor is 22.13 because
      # pnpm 11 declares `node >=22.13` and bundles `node:sqlite`, which Node 20
      # does not have — so pnpm cannot even be installed there (ERR-007). If this
      # job fails, the declared engine range is wrong.
      - name: Install and build on the declared floor
        run: pnpm build

  dem-contract:
    name: DEM fetch script contract
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - uses: actions/checkout@v7.0.1

      - uses: pnpm/action-setup@v6.1.0
        with:
          version: 11.16.0

      - name: Set up Node
        uses: actions/setup-node@v7.0.0
        with:
          # Node 24, not the declared 20.19 floor: the script imports `src/*.ts`
          # directly and needs native type stripping, which does not exist in
          # Node 20. Deliberately duplicated from the quality job's rationale.
          node-version: '24'
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Verify the DEM fetch script parses
        # Only a parse check. Asserting that the upstream COG still answers would
        # let a network dependency redden CI, and a CI failure nobody can fix by
        # changing code trains people to ignore CI.
        run: node --check scripts/fetch-dem.mjs

      - name: Verify the fetch plan without touching the network
        # Catches the class of bug where the grid dimensions or the resample
        # signature drift apart from the module they call — an arithmetic or
        # argument-order change fails here in 5 seconds instead of after a
        # 36MB download.
        run: node scripts/fetch-dem.mjs --dry-run
